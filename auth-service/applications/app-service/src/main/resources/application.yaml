server:
  port: 8080
spring:
  application:
    name: "AuthService"
  devtools:
    add-properties: false

  sql:
    init:
      mode: never
      platform: postgresql
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null

adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "crediya"
    schema: "public"
    username: "postgres"
    password: "postgres"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

logging:
  level:
    org.springframework.web: DEBUG